spring:

  application:
    name: rag-bootstrap
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    vectorstore:
      type: none

rag:
  vector:
    type: milvus
    milvus:
      uri: http://localhost:19530
      collection-name: user_resume_vector
      dimension: 1536
      metric-type: COSINE
      initialize-schema: true

rustfs:
  url: http://localhost:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin
  create-bucket-if-missing: true




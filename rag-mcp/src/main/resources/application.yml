server:
  port: 8081

spring:
  application:
    name: rag-mcp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mcp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  ai:
    mcp:
      server:
        annotation-scanner:
          enabled: false
        name: rag-mcp
        version: 1.0.0
        instructions: "RAG MCP server exposing search and answer tools with fileId citations."
        type: sync
        protocol: sse
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
